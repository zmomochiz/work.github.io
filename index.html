<!DOCTYPE html>
<html lang="th" class="dark-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JobManager">
    <link rel="manifest" href="manifest.json">
    <title>ระบบจัดการงานลูกค้า</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 10px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #0f3460;
        }
        h1, h2 {
            color: #bb86fc;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="tel"], input[type="url"], textarea, input[type="datetime-local"] {
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 16px;
            font-family: 'Sarabun', sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            border-color: #4a4e69;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            padding: 12px 20px;
            background-image: linear-gradient(45deg, #8e44ad, #9b59b6);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        button:hover {
            background-image: linear-gradient(45deg, #9b59b6, #8e44ad);
        }
        .job-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .job-table th, .job-table td {
            border: 1px solid #444;
            padding: 12px;
            text-align: left;
        }
        .job-table th {
            background-color: #333;
            color: #bb86fc;
        }
        .job-table tr:nth-child(even) {
            background-color: #1f294a;
        }
        .status-pending { color: #ffb74d; font-weight: bold; }
        .status-completed { color: #81c784; font-weight: bold; }
        
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            background-image: linear-gradient(45deg, #8e44ad, #9b59b6);
            font-size: 14px;
            padding: 8px 12px;
            width: auto;
            flex-grow: 1;
        }
        .action-btn:hover {
            background-image: linear-gradient(45deg, #9b59b6, #8e44ad);
        }
        .action-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .delete-btn {
            background-image: linear-gradient(45deg, #c0392b, #e74c3c);
        }
        .delete-btn:hover {
            background-image: linear-gradient(45deg, #e74c3c, #c0392b);
        }

        .notes-input {
            width: 95%;
            margin-top: 10px;
            background-color: #1a1a2e;
            color: #fff;
            border: 1px solid #4a4e69;
        }
        a { color: #bb86fc; }

        .date-header {
            background-color: #e94560;
            color: white;
            font-weight: bold;
            text-align: center !important;
        }

        /* Mobile Responsive Styles */
        @media screen and (max-width: 768px) {
            .job-table thead {
                display: none;
            }
            .job-table tr {
                display: block;
                margin-bottom: 15px;
                border: 1px solid #444;
                border-radius: 8px;                
                background-color: #1f294a;
            }
            .job-table td {
                display: block;
                text-align: right;
                font-size: 15px;
                border-bottom: 1px solid #444;
                position: relative;
                padding-left: 40%;
            }
            .job-table td::before {
                content: attr(data-label);
                position: absolute;
                left: 10px;
                width: 35%;
                font-weight: bold;
                text-align: left;
                color: #bb86fc;
            }
            .job-table td:last-child {
                border-bottom: 0;
            }
            button {
                margin-top: 10px;
            }
            td.date-header, td.empty-message {
                padding-left: 12px;
                text-align: center;
            }
            td.date-header::before, td.empty-message::before {
                display: none;
            }
        }

    </style>
    <!-- Google Fonts for Thai characters -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>ระบบจัดการงานลูกค้า</h1>

        <h2>เพิ่มงานใหม่</h2>
        <form id="add-job-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="customer-name">ชื่อ User ลูกค้า</label>
                    <input type="text" id="customer-name" required>
                </div>
                <div class="form-group">
                    <label for="customer-phone">เบอร์โทร</label>
                    <input type="tel" id="customer-phone" required>
                </div>
                <div class="form-group">
                    <label for="customer-address-text">ที่อยู่ (ตัวหนังสือ)</label>
                    <textarea id="customer-address-text"></textarea>
                </div>
                <div class="form-group">
                    <label for="customer-address-link">ลิงค์ที่อยู่ (เช่น Google Maps)</label>
                    <input type="url" id="customer-address-link" placeholder="https://maps.app.goo.gl/...">
                </div>
                <div class="form-group">
                    <label for="job-description">อาการ/รายละเอียดงาน</label>
                    <textarea id="job-description" required></textarea>
                </div>
                <div class="form-group">
                    <label>ระยะเวลาที่ใช้</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="job-duration-hours" placeholder="ชั่วโมง" min="0" style="width: 50%;">
                        <input type="number" id="job-duration-minutes" placeholder="นาที" min="0" max="59" style="width: 50%;">
                    </div>
                </div>
                <div class="form-group">
                    <label for="job-date">วันที่ต้องทำ</label>
                    <input type="date" id="job-date" required>
                </div>
                <div class="form-group">
                    <label for="job-time">เวลา</label>
                    <input type="time" id="job-time" required>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit" id="submit-btn">เพิ่มงาน</button>
                <button type="button" id="cancel-btn" onclick="resetFormState()" style="display: none; background-image: linear-gradient(45deg, #95a5a6, #7f8c8d);">ยกเลิก</button>
            </div>
            </form>

            <h2>ตารางงาน (Job Queue)</h2>
            <table class="job-table">
                <thead>
                    <tr>
                        <th>ลูกค้า</th>
                        <th>ติดต่อ</th>
                        <th>ที่อยู่</th>
                        <th>รายละเอียดงาน</th>
                        <th>กำหนดการ</th>
                        <th>สถานะ</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="job-list">
                    <!-- Job items will be inserted here by JavaScript -->
                </tbody>
            </table>
    </div>

    <script>
        // --- 0. PWA SETUP ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.error('Service Worker Failed', err));
        }

        // --- 1. DATA STORAGE (DATABASE SIMULATION) ---
        // We use localStorage to persist data on the user's browser.
        let jobs = [];
        let isEditing = false;
        let editingJobId = null;

        // --- 2. DOM ELEMENT REFERENCES ---
        const form = document.getElementById('add-job-form');
        const jobList = document.getElementById('job-list');

        // --- 3. FUNCTIONS ---

        /**
         * Saves the current jobs array to localStorage.
         */
        function saveJobs() {
            localStorage.setItem('jobs', JSON.stringify(jobs));
        }

        /**
         * Loads jobs from localStorage.
         */
        function loadJobs() {
            const storedJobs = localStorage.getItem('jobs');
            if (storedJobs) {
                jobs = JSON.parse(storedJobs);
            }
        }

        /**
         * Renders all jobs from the 'jobs' array into the table.
         */
        function renderJobs() {
            // Clear current table content
            jobList.innerHTML = '';

            if (jobs.length === 0) {
                jobList.innerHTML = '<tr><td colspan="7" class="empty-message" style="text-align:center;">ยังไม่มีงานในระบบ</td></tr>';
                return;
            }
            
            // Sort jobs: pending first, then by schedule datetime
            jobs.sort((a, b) => {
                if (a.status === 'pending' && b.status === 'completed') return -1;
                if (a.status === 'completed' && b.status === 'pending') return 1;
                return new Date(a.schedule) - new Date(b.schedule);
            });

            let lastDate = null;

            // Create and append a table row for each job
            jobs.forEach(job => {
                const jobDate = new Date(job.schedule).toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

                // Add a date header if the day is different from the last one
                if (jobDate !== lastDate) {
                    const dateRow = document.createElement('tr');
                    dateRow.innerHTML = `<td colspan="7" class="date-header">${jobDate}</td>`;
                    jobList.appendChild(dateRow);
                    lastDate = jobDate;
                }

                const row = document.createElement('tr');
                row.id = `job-${job.id}`;

                const addressLink = job.address.link ? `<a href="${job.address.link}" target="_blank">เปิดลิงค์</a>` : 'ไม่มีลิงค์';
                const addressInfo = `${job.address.text} <br>(${addressLink})`;
                
                const statusClass = job.status === 'pending' ? 'status-pending' : 'status-completed';
                const statusText = job.status === 'pending' ? 'รอดำเนินการ' : 'เสร็จสิ้น';
                
                const scheduleTime = new Date(job.schedule).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });

                row.innerHTML = `
                    <td data-label="ลูกค้า">${job.customer.name}</td>
                    <td data-label="ติดต่อ">
                        <a href="tel:${job.customer.phone}">${job.customer.phone}</a>
                        <button type="button" onclick="copyToClipboard('${job.customer.phone}')" style="display: inline-block; width: auto; padding: 4px 8px; margin-left: 5px; font-size: 12px;">คัดลอก</button>
                    </td>
                    <td data-label="ที่อยู่">${addressInfo}</td>
                    <td data-label="รายละเอียด">
                        <strong>อาการ:</strong> ${job.description}<br>
                        <strong>เวลาที่ใช้:</strong> ${job.duration}
                    </td>
                    <td data-label="เวลา">${scheduleTime}</td>
                    <td data-label="สถานะ"><span class="${statusClass}">${statusText}</span></td>
                    <td data-label="จัดการ" id="action-cell-${job.id}"></td>
                `;
                
                jobList.appendChild(row);
                
                // Create and add action button/notes area
                const actionCell = document.getElementById(`action-cell-${job.id}`);
                const buttonContainer = document.createElement('div');
                buttonContainer.className = 'action-buttons';

                if (job.status === 'pending') {
                    const completeButton = document.createElement('button');
                    completeButton.textContent = 'ทำงานเสร็จแล้ว';
                    completeButton.classList.add('action-btn');
                    completeButton.onclick = () => completeJob(job.id);
                    buttonContainer.appendChild(completeButton);

                    const editButton = document.createElement('button');
                    editButton.textContent = 'แก้ไข';
                    editButton.classList.add('action-btn');
                    editButton.style.backgroundImage = 'linear-gradient(45deg, #f39c12, #d35400)'; // Orange color
                    editButton.onclick = () => editJob(job.id);
                    buttonContainer.appendChild(editButton);

                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = 'ลบ';
                    deleteButton.classList.add('action-btn', 'delete-btn');
                    deleteButton.onclick = () => deleteJob(job.id);
                    buttonContainer.appendChild(deleteButton);

                    actionCell.appendChild(buttonContainer);
                } else {
                    const notesArea = document.createElement('div');
                    notesArea.innerHTML = `
                        <label for="notes-${job.id}"><strong>ข้อมูลทิ้งท้าย:</strong></label>
                        <textarea id="notes-${job.id}" class="notes-input" placeholder="กรอกข้อมูลหลังจบงาน...">${job.notes || ''}</textarea>
                    `;
                    actionCell.appendChild(notesArea);
                    
                    const notesTextarea = document.getElementById(`notes-${job.id}`);
                    notesTextarea.addEventListener('blur', (e) => saveNotes(job.id, e.target.value)); // Use 'blur' to save when user clicks away

                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = 'ลบ';
                    deleteButton.classList.add('action-btn', 'delete-btn');
                    deleteButton.style.marginTop = '10px';
                    deleteButton.onclick = () => deleteJob(job.id);
                    actionCell.appendChild(deleteButton);
                }
            });
        }

        /**
         * Handles the form submission to add a new job.
         * @param {Event} event The form submission event.
         */
        function addJob(event) {
            event.preventDefault(); // Prevent page from reloading

            const hours = document.getElementById('job-duration-hours').value || 0;
            const minutes = document.getElementById('job-duration-minutes').value || 0;
            const durationText = `${hours} ชั่วโมง ${minutes} นาที`;

            const date = document.getElementById('job-date').value;
            const time = document.getElementById('job-time').value;
            const scheduleDateTime = `${date}T${time}`;

            if (isEditing) {
                // Update existing job
                const jobIndex = jobs.findIndex(j => j.id === editingJobId);
                if (jobIndex !== -1) {
                    jobs[jobIndex].customer.name = document.getElementById('customer-name').value;
                    jobs[jobIndex].customer.phone = document.getElementById('customer-phone').value;
                    jobs[jobIndex].address.text = document.getElementById('customer-address-text').value;
                    jobs[jobIndex].address.link = document.getElementById('customer-address-link').value;
                    jobs[jobIndex].description = document.getElementById('job-description').value;
                    jobs[jobIndex].duration = durationText;
                    jobs[jobIndex].schedule = scheduleDateTime;
                    
                    saveJobs();
                    renderJobs();
                    resetFormState();
                    alert('แก้ไขข้อมูลเรียบร้อยแล้ว');
                }
            } else {
                // Create a new job object
                const newJob = {
                    id: Date.now(), // Simple unique ID
                    customer: {
                        name: document.getElementById('customer-name').value,
                        phone: document.getElementById('customer-phone').value,
                    },
                    address: {
                        text: document.getElementById('customer-address-text').value,
                        link: document.getElementById('customer-address-link').value,
                    },
                    description: document.getElementById('job-description').value,
                    duration: durationText,
                    schedule: scheduleDateTime,
                    status: 'pending', // 'pending' or 'completed'
                    notes: ''
                };

                // Add the new job to our array
                jobs.push(newJob);
                saveJobs();

                // Reset the form for the next entry
                form.reset();

                // Re-render the job list to show the new job
                renderJobs();
            }
        }

        /**
         * Marks a job as completed.
         * @param {number} jobId The ID of the job to complete.
         */
        function completeJob(jobId) {
            const job = jobs.find(j => j.id === jobId);
            if (job) {
                job.status = 'completed';
                saveJobs();
                renderJobs(); // Re-render to show the change
            }
        }

        /**
         * Prepares the form for editing a job.
         * @param {number} jobId The ID of the job to edit.
         */
        function editJob(jobId) {
            const job = jobs.find(j => j.id === jobId);
            if (!job) return;

            document.getElementById('customer-name').value = job.customer.name;
            document.getElementById('customer-phone').value = job.customer.phone;
            document.getElementById('customer-address-text').value = job.address.text;
            document.getElementById('customer-address-link').value = job.address.link;
            document.getElementById('job-description').value = job.description;

            // Parse duration back to inputs
            const durationMatch = job.duration.match(/(\d+)\s*ชั่วโมง\s*(\d+)\s*นาที/);
            if (durationMatch) {
                document.getElementById('job-duration-hours').value = durationMatch[1];
                document.getElementById('job-duration-minutes').value = durationMatch[2];
            }

            // Parse schedule back to inputs
            const [date, time] = job.schedule.split('T');
            document.getElementById('job-date').value = date;
            document.getElementById('job-time').value = time;

            isEditing = true;
            editingJobId = jobId;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.textContent = 'บันทึกการแก้ไข';
            submitBtn.style.backgroundImage = 'linear-gradient(45deg, #f39c12, #d35400)';
            
            document.getElementById('cancel-btn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFormState() {
            form.reset();
            isEditing = false;
            editingJobId = null;
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.textContent = 'เพิ่มงาน';
            submitBtn.style.backgroundImage = ''; // Revert to default CSS
            document.getElementById('cancel-btn').style.display = 'none';
        }
        
        /**
         * Deletes a job from the list.
         * @param {number} jobId The ID of the job to delete.
         */
        function deleteJob(jobId) {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบงานนี้?')) {
                jobs = jobs.filter(j => j.id !== jobId);
                saveJobs();
                renderJobs();
            }
        }

        /**
         * Saves the final notes for a completed job.
         * @param {number} jobId The ID of the job.
         * @param {string} notes The notes to save.
         */
        function saveNotes(jobId, notes) {
            const job = jobs.find(j => j.id === jobId);
            if (job) {
                job.notes = notes;
                saveJobs();
                console.log(`Notes saved for job ${jobId}: "${notes}"`);
            }
        }

        /**
         * Copies text to clipboard
         * @param {string} text The text to copy.
         */
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('คัดลอกเบอร์โทรเรียบร้อยแล้ว: ' + text);
            }).catch(err => {
                console.error('ไม่สามารถคัดลอกได้: ', err);
            });
        }

        // --- 4. EVENT LISTENERS ---
        // Listen for form submission
        form.addEventListener('submit', addJob);

        // Initial render of the job list when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadJobs();
            renderJobs();
        });

    </script>

</body>
</html>
